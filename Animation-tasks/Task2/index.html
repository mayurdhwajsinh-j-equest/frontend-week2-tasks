<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation task2 | Card hover effect</title>
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="wrapper">

        <div class="card effect1">
            <div class="card-header">
                <img src="https://images.pexels.com/users/avatars/146718/nextvoyage-287.jpeg?auto=compress&fit=crop&h=50&w=50&dpr=1" alt="">
                <label class="card-header__lbl">Nextvoyage</label>
            </div>
            <div class="card-img">
                <img src="https://images.pexels.com/photos/3030647/pexels-photo-3030647.jpeg" alt="">
            </div>
            <div class="card-footer">
                <p class="card-footer__title">Times Square</p>
                <p class="card-footer__place">New York, NY, United States</p>
            </div>
        </div>

        <div class="card effect2">
            <div class="card-header">
                <img src="https://images.pexels.com/users/avatars/156925946/ben-kirby-503.png?auto=compress&fit=crop&h=50&w=50&dpr=1" alt="">
                <label class="card-header__lbl">The balls</label>
            </div>
            <div class="card-img">
                <img src="https://images.pexels.com/photos/11130836/pexels-photo-11130836.jpeg" alt="">
            </div>
            <div class="card-footer">
                <p class="card-footer__title">St Paul's Cathedral</p>
                <p class="card-footer__place">England, United Kingdom</p>
            </div>
        </div>

        <div class="card effect3">
            <div class="card-header">
                <img src="https://images.pexels.com/users/avatars/1480481/viviana-ceballos-761.jpeg?auto=compress&fit=crop&h=50&w=50&dpr=1" alt="">
                <label class="card-header__lbl">Viviana</label>
            </div>
            <div class="card-img">
                <img src="https://images.pexels.com/photos/3283109/pexels-photo-3283109.jpeg" alt="">
            </div>
            <div class="card-footer">
                <p class="card-footer__title">Eiffel Tower</p>
                <p class="card-footer__place">Paris, Île-de-France, France</p>
            </div>
        </div>

        <div class="card effect4">
            <div class="card-header">
                <img src="https://images.pexels.com/users/avatars/360565/enis-mehmeti-752.jpeg?auto=compress&fit=crop&h=50&w=50&dpr=1" alt="">
                <label class="card-header__lbl">Enis Mehmeti</label>
            </div>
            <div class="card-img">
                <img src="https://images.pexels.com/photos/17420091/pexels-photo-17420091.jpeg" alt="">
            </div>
            <div class="card-footer">
                <p class="card-footer__title">Galleria Umberto</p>
                <p class="card-footer__place">Naples, Campania, Italy</p>
            </div>
        </div>

        <div class="card effect5">
            <div class="card-header">
                <img src="https://images.pexels.com/users/avatars/360565/enis-mehmeti-752.jpeg?auto=compress&fit=crop&h=50&w=50&dpr=1" alt="">
                <label class="card-header__lbl">Athena</label>
            </div>
            <div class="card-img">
                <img src="https://images.pexels.com/photos/3009966/pexels-photo-3009966.jpeg" alt="">
            </div>
            <div class="card-footer">
                <p class="card-footer__title">Golden Gate Bridge</p>
                <p class="card-footer__place">San Francisco, California</p>
            </div>
        </div>

    </div>

    <footer>
        <div class="copyright">
            Inspired by
            <a href="https://www.designdrastic.com/snippet/unveiling-card-details-on-hover-effects">Designdrastic</a>
        </div>
    </footer>
</body>
</html>
