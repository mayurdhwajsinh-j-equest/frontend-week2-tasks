<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation task6 | Slide Reveal Card</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
   <div class="container">
        <div class="card">
            <div class="slide slide1">
                <img src="images/hero-img.jpeg" alt="">
            </div>
            <div class="card-header">
                <h2 class="card-title">Digital Dreams</h2>
		        <p class="card-subtitle">A journey through digital art landscapes</p>   
            </div>
            <div class="slide slide2">
                    <p class="card-description">
                        Explore stunning digital worlds created by top artists from around the globe.
                        Each piece tells a unique story that bridges reality and imagination.
                    </p>
                    <div class="card-details">
                        <div class="detail-item">
                            <div class="detail-value">24</div>
                            <div class="detail-label">Artists</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">85</div>
                            <div class="detail-label">Artworks</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value">4.9</div>
                            <div class="detail-label">Rating</div>
                        </div>
                    </div>
		             <button class="card-button">View Collection</button>
	        </div>
        </div>
    </div>
</body>
</html>
